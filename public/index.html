<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
        integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
        crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="js/tweaks-panel.js"></script>
<script type="text/babel" src="js/shopify.js"></script>
<script type="text/babel" src="js/gate.js"></script>
<script type="text/babel" src="js/flatlay-shop.js"></script>

<script type="text/babel" data-presets="react">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accent": "#30ff14",
    "scanlines": true,
    "phosphor": true
  }/*EDITMODE-END*/;

  function Page() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const accent = t.accent;
    const isMobile = useIsMobile();

    // Live products from Shopify (falls back to the local catalog if offline).
    const shop = useShopifyProducts();
    const items = (shop.items && shop.items.length) ? shop.items : window.FALLBACK_ITEMS;
    const soldOut = items.filter((it) => it.stock === 'sold out').length;

    const accentRgb = (() => {
      const h = accent.replace('#', '');
      const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    })();
    const rgba = (a) => `rgba(${accentRgb.join(',')},${a})`;

    // cart state
    const [cart, setCart] = React.useState([]);
    const [cmdLog, setCmdLog] = React.useState([
      { kind: 'sys', text: 'mowgli@barely.cool ▸ tty1 ▸ welcome' },
      { kind: 'sys', text: 'type "help" or click any item above' },
    ]);
    const [typing, setTyping] = React.useState('');
    const [input, setInput] = React.useState('');
    // Branded handoff overlay shown briefly before the Shopify redirect so the
    // jump to hosted checkout reads as one continuous flow, not a detour.
    const [routing, setRouting] = React.useState(false);

    React.useEffect(() => {
      const onAdd = (e) => {
        const it = e.detail;
        const sizeFlag = it.size ? ` --size ${it.size}` : '';
        const fullCmd = `add ${it.sku}${sizeFlag} --qty 1`;
        const label = it.size ? `${it.name} [${it.size}]` : it.name;
        let i = 0;
        const tick = () => {
          if (i <= fullCmd.length) {
            setTyping(fullCmd.slice(0, i));
            i++; setTimeout(tick, 28);
          } else {
            setTyping('');
            setCmdLog((l) => [
              ...l,
              { kind: 'cmd', text: `$ ${fullCmd}` },
              { kind: 'ok',  text: `▸ added: ${label} (${it.sku}) +$${it.price} → cart` },
            ].slice(-8));
            setCart((c) => [...c, it]);
          }
        };
        tick();
      };
      window.addEventListener('bc-cart-add', onAdd);
      return () => window.removeEventListener('bc-cart-add', onAdd);
    }, []);

    const runCmd = (raw) => {
      const cmd = raw.trim().toLowerCase();
      if (!cmd) return;
      let out = [{ kind: 'cmd', text: `$ ${raw}` }];
      if (cmd === 'help') {
        out.push({ kind: 'sys', text: '  cart      ▸ show cart' });
        out.push({ kind: 'sys', text: '  rm <#>    ▸ remove item #' });
        out.push({ kind: 'sys', text: '  clear     ▸ empty cart' });
        out.push({ kind: 'sys', text: '  checkout  ▸ go to checkout' });
        out.push({ kind: 'sys', text: '  ls        ▸ list items' });
        out.push({ kind: 'sys', text: '  mail      ▸ mowgli@barely.cool' });
      } else if (cmd === 'cart') {
        if (cart.length === 0) out.push({ kind: 'sys', text: '▸ cart empty' });
        else {
          cart.forEach((x, i) => {
            const sz = x.size ? ` [${x.size}]` : '';
            out.push({ kind: 'sys', text: `  ${String(i + 1).padStart(2, '0')}. ${x.sku}${sz}  ${x.name}  $${x.price}.00` });
          });
          const total = cart.reduce((s, x) => s + x.price, 0);
          out.push({ kind: 'ok', text: `▸ ${cart.length} item${cart.length > 1 ? 's' : ''} ▸ subtotal $${total}.00` });
        }
      } else if (cmd.startsWith('rm ') || cmd.startsWith('remove ')) {
        // Remove a single line item by its 1-based number (as shown by "cart").
        // Index-based so duplicate SKUs each drop independently.
        const n = parseInt(cmd.split(/\s+/)[1], 10);
        if (!n || n < 1 || n > cart.length) {
          out.push({ kind: 'err', text: '▸ usage: rm <#> — run "cart" to see item numbers' });
        } else {
          const gone = cart[n - 1];
          setCart((c) => c.filter((_, i) => i !== n - 1));
          const sz = gone.size ? ` [${gone.size}]` : '';
          out.push({ kind: 'ok', text: `▸ removed: ${gone.name}${sz} (${gone.sku})` });
        }
      } else if (cmd === 'clear') {
        setCart([]);
        out.push({ kind: 'ok', text: '▸ cart cleared' });
      } else if (cmd === 'checkout') {
        if (cart.length === 0) {
          out.push({ kind: 'err', text: '▸ cart is empty' });
        } else {
          // Build a Shopify cart permalink (/cart/{variantId}:{qty},...) so the
          // buyer lands in real hosted checkout. Fall back to email if any item
          // has no variant id (e.g. the offline fallback catalog).
          const qtyByVariant = {};
          cart.forEach((it) => {
            const vid = (it.size && it.variantBySize) ? it.variantBySize[it.size] : it.variantId;
            if (vid) qtyByVariant[vid] = (qtyByVariant[vid] || 0) + 1;
          });
          const path = Object.entries(qtyByVariant).map(([id, q]) => `${id}:${q}`).join(',');
          if (path && cart.every((it) => (it.size && it.variantBySize) ? it.variantBySize[it.size] : it.variantId)) {
            out.push({ kind: 'ok', text: '▸ routing to secure checkout...' });
            const domain = (window.SHOPIFY_CONFIG && window.SHOPIFY_CONFIG.domain) || '';
            setRouting(true);
            setTimeout(() => { window.location.href = `https://${domain}/cart/${path}`; }, 1100);
          } else {
            out.push({ kind: 'ok', text: '▸ no online checkout — opening email...' });
            setTimeout(() => { window.location.href = 'mailto:mowgli@barely.cool?subject=Order'; }, 800);
          }
        }
      } else if (cmd === 'ls') {
        out.push({ kind: 'sys', text: '▸ scroll up — flatlay above. click to inspect.' });
      } else if (cmd === 'mail' || cmd === 'email') {
        out.push({ kind: 'ok', text: '▸ mowgli@barely.cool — if you email me dumb stuff you will get your head blown off' });
      } else if (cmd === 'sudo rm -rf /') {
        out.push({ kind: 'err', text: '▸ nice try' });
      } else {
        out.push({ kind: 'err', text: `▸ unknown command: ${raw} — try "help"` });
      }
      setCmdLog((l) => [...l, ...out].slice(-8));
      setInput('');
    };

    return (
      <div style={{
        maxWidth: 1100, margin: '0 auto',
        padding: isMobile ? '12px 10px 340px' : '20px 18px 220px',
        position: 'relative',
        animation: 'bcPageIn .5s ease both',
      }}>
        <style>{`@keyframes bcPageIn{from{opacity:0}to{opacity:1}}`}</style>
        {routing && (
          <div style={{
            position: 'fixed', inset: 0, zIndex: 6000, background: '#02040a',
            backgroundImage:
              'radial-gradient(ellipse at 50% 50%, ' + rgba(0.06) + ', transparent 60%)',
            color: accent, fontFamily: 'ui-monospace, "JetBrains Mono", monospace',
            display: 'flex', flexDirection: 'column', alignItems: 'center',
            justifyContent: 'center', gap: 14, padding: 24, textAlign: 'center',
          }}>
            <div style={{
              fontSize: 13, letterSpacing: 3, color: rgba(0.55),
            }}>[ barely.cool ▸ secure checkout ]</div>
            <div style={{
              fontSize: isMobile ? 16 : 20, textShadow: `0 0 6px ${accent}`,
            }}>▸ routing to secure checkout<span className="bc-dots"></span></div>
            <div style={{
              width: 200, height: 2, background: rgba(0.18), overflow: 'hidden',
              borderRadius: 2,
            }}>
              <div style={{
                width: '40%', height: '100%', background: accent,
                boxShadow: `0 0 8px ${accent}`, animation: 'bcRoute 1.1s ease-in-out infinite',
              }} />
            </div>
            <div style={{ fontSize: 11, color: rgba(0.45), letterSpacing: 1, marginTop: 6 }}>
              payments handled securely by shopify · don't close this tab
            </div>
            <div style={{
              position: 'fixed', inset: 0, pointerEvents: 'none',
              backgroundImage: 'repeating-linear-gradient(0deg, rgba(0,0,0,.32) 0 1px, transparent 1px 3px)',
            }} />
            <style>{`@keyframes bcRoute{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}@keyframes bcDots{0%,20%{content:""}40%{content:"."}60%{content:".."}80%,100%{content:"..."}}.bc-dots::after{content:"";animation:bcDots 1.1s steps(1) infinite}`}</style>
          </div>
        )}
        {/* CRT title bar */}
        <div style={{
          background: '#06080a', border: `1px solid ${rgba(0.22)}`,
          padding: '6px 14px', display: 'flex', justifyContent: 'space-between',
          flexWrap: 'wrap', gap: 4, fontSize: 11, color: rgba(0.5),
        }}>
          <span>barely.cool ▸ /home/mowgli ▸ tty1</span>
          <span>SESS 04219081 ▸ {new Date().toLocaleDateString('en-US')} ▸ uptime 19h ▸ cart [{cart.length}]</span>
        </div>

        {/* ASCII header */}
        <div style={{
          padding: '20px 14px 10px',
          border: `1px solid ${rgba(0.22)}`, borderTop: 'none',
          textAlign: 'center',
        }}>
          <pre style={{
            margin: 0, fontSize: isMobile ? 8 : 13, color: accent, lineHeight: 1.0,
            textShadow: t.phosphor ? `0 0 6px ${accent}` : 'none',
            display: 'inline-block', textAlign: 'left',
          }}>
{`  ____    __    ____  ____  __    _  _   ___  __  __   __
 (  _ \\  /  \\  (  _ \\(  __)(  )  ( \\/ ) / __)/  \\/  \\ (  )
  ) _ ( /    \\  )   / ) _) / (_/\\ )  / ( (__(  O )(  O )/ /
 (____/ \\_/\\_/ (__\\_)(____)\\____/(__/   \\___)\\__/  \\__/(__) `}
          </pre>
          <div style={{ fontSize: 11, color: rgba(0.5), marginTop: 6, letterSpacing: 2 }}>
            [ build log + drygoods · 20nup ent · est. neocities mmxxiv ]
          </div>
        </div>

        {/* visitor strip */}
        <div style={{
          borderTop: `1px solid ${rgba(0.22)}`, padding: '8px 12px',
          color: rgba(0.5), fontSize: 11, textAlign: 'right',
        }}>uid=mowgli ▸ visitors:<span id="fc2-counter"><Fc2Counter id="40219080" /></span></div>

        <div style={{ padding: isMobile ? '14px 12px' : '18px',
          border: `1px solid ${rgba(0.22)}`, borderTop: 'none' }}>
          {/* SHOP — flatlay */}
          <div id="shop" style={{ fontSize: 11, color: rgba(0.5), marginBottom: 10 }}>
            ─[ /opt/shop/flatlay.png ]────────── render: {items.length} item{items.length === 1 ? '' : 's'} ──────
          </div>

          <FlatlayShop accent={accent} items={items} loading={shop.loading} error={shop.error} />

          <div style={{ marginTop: 10, fontSize: 11, color: rgba(0.5),
            display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap' }}>
            <span>{items.length} item{items.length === 1 ? '' : 's'} ▸ {soldOut} sold out ▸ 0 preorder ▸ ship usps fri</span>
            <span>// chaos.layout v0.4 ▸ powered by tape</span>
          </div>

          {/* build log */}
          <div id="log" style={{ fontSize: 11, color: rgba(0.5), margin: '24px 0 10px' }}>
            ─[ /var/log/build.txt ]──────────────────────────────────────
          </div>

          {[
            { d: '2026-06-24', h: 'late_night_progress.txt', sz: '0.8k',
              body: '> bent up some trailing arms for the homies. came out clean.\n> piling more into the shop — got a few ideas i wanna bring to life.\n> car: all bolts checked + torqued. raised it a few mm, picked up ~2deg camber\n> up front since the upper is already at a severe angle. just need a decent\n> eyeball alignment then self-clearance laps around the block at 3am.' },
            { d: '2026-05-04', h: 'h3ll0w0rl6.txt', sz: '0.7k',
              body: '> giving the site a new look to motivate myself and the internet to go build cool shit.. hope i can stick with it.' },
            { d: '2024-03-14', h: 'better_late_than_never.txt', sz: '0.5k',
              body: '> one bottle neck to drop #1: needed to outsource the patch work ($10/ea.. wtf).\n> now i have my own machine. passing the savings on to you. :>' },
            { d: '2024-02-07', h: 'found_my_footing.txt', sz: '0.4k',
              body: '> at first i lost hope with this html stuff.. but i understand it now.\n> ben davis 1/2 zips made it to a few friends. ordering more shirt boards.\n> ready to start taking orders by end of feb. work shirt #2 in the teaser queue.' },
          ].map((p, i) => (
            <div key={i} style={{ marginBottom: 14, paddingBottom: 10,
              borderBottom: `1px dashed ${rgba(0.22)}` }}>
              <div style={{ display: 'flex', gap: 10, fontSize: 11, color: rgba(0.5),
                flexWrap: 'wrap' }}>
                <span>{p.d}</span>
                <span style={{ color: accent, fontWeight: 700,
                  textShadow: t.phosphor ? `0 0 4px ${accent}` : 'none' }}>▸ {p.h}</span>
                <span>{p.sz}</span>
              </div>
              <pre style={{ margin: '6px 0 0', whiteSpace: 'pre-wrap',
                fontFamily: 'inherit', fontSize: 13, color: accent, lineHeight: 1.5,
                textShadow: t.phosphor ? `0 0 3px ${accent}` : 'none' }}>{p.body}</pre>
            </div>
          ))}

          {/* CONTACT */}
          <div id="about" style={{ fontSize: 11, color: rgba(0.5), margin: '24px 0 10px' }}>
            ─[ ~/contact ]───────────────────────────────────────────────
          </div>
          <div style={{
            padding: 10, border: `1px solid ${rgba(0.22)}`, background: '#06080a',
            maxWidth: 360,
          }}>
            <div style={{ fontSize: 11, color: rgba(0.5) }}>$ cat email.txt</div>
            <a href="mailto:mowgli@barely.cool" style={{
              display: 'block', fontSize: 14, color: '#fff', margin: '4px 0', fontWeight: 700,
              textDecoration: 'none',
              textShadow: t.phosphor ? `0 0 4px ${accent}` : 'none',
            }}>mowgli@barely.cool</a>
            <div style={{ fontSize: 11, color: rgba(0.5), marginTop: 6, lineHeight: 1.5 }}>
              # WARNING<br/>
              # if you email me dumb stuff<br/>
              # you will get your head blown off<br/>
              # this is not a joke
            </div>
            <pre style={{ margin: '6px 0 0', fontSize: 12, color: '#ff5544', lineHeight: 1 }}>
{`   ___
  /(__\\
 ( _-_ )
  \\___/ -==o)`}
            </pre>
          </div>
        </div>

        {/* footer status bar */}
        <div style={{
          background: accent, color: '#000', padding: '4px 14px', fontSize: 11,
          display: 'flex', justifyContent: 'space-between', fontWeight: 700,
          flexWrap: 'wrap', gap: 8,
        }}>
          <span>NORMAL ▸ /home/mowgli ▸ utf-8 ▸ unix</span>
          <span>©2026 20nup by BarelyCool LLC</span>
          <span>Ln 04 ▸ Col 29 ▸ 100%</span>
        </div>

        {/* sticky terminal cart */}
        <CartTerminal
          accent={accent} rgba={rgba} cart={cart} cmdLog={cmdLog} typing={typing}
          input={input} setInput={setInput} runCmd={runCmd} phosphor={t.phosphor}
          isMobile={isMobile}
        />

        {t.scanlines && (
          <div style={{
            position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 1000,
            backgroundImage: 'repeating-linear-gradient(0deg, rgba(0,0,0,.32) 0 1px, transparent 1px 3px)',
          }} />
        )}
        <div style={{
          position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 999,
          background: 'radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.55) 100%)',
        }} />

        <TweaksPanel title="Tweaks">
          <TweakSection label="Display" />
          <TweakColor  label="Accent" value={t.accent} onChange={(v) => setTweak('accent', v)} />
          <TweakToggle label="CRT scanlines" value={t.scanlines} onChange={(v) => setTweak('scanlines', v)} />
          <TweakToggle label="Phosphor glow" value={t.phosphor} onChange={(v) => setTweak('phosphor', v)} />
        </TweaksPanel>
      </div>
    );
  }

  function CartTerminal({ accent, rgba, cart, cmdLog, typing, input, setInput, runCmd, phosphor, isMobile }) {
    const total = cart.reduce((s, x) => s + x.price, 0);
    const inputRef = React.useRef(null);
    const logRef = React.useRef(null);
    React.useEffect(() => {
      if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
    }, [cmdLog, typing]);

    return (
      <div style={{
        position: 'fixed', left: 0, right: 0, bottom: 0, zIndex: 100,
        background: '#06080a', borderTop: `1px solid ${accent}`,
        boxShadow: phosphor ? `0 -4px 20px ${rgba(0.25)}` : 'none',
        fontFamily: 'inherit', color: accent,
      }}>
        <div style={{ maxWidth: 1100, margin: '0 auto',
          padding: isMobile ? '8px 12px' : '8px 18px',
          display: 'grid',
          gridTemplateColumns: isMobile ? '1fr' : '1fr 280px',
          gap: isMobile ? 8 : 16, alignItems: 'stretch' }}>
          <div onClick={() => inputRef.current && inputRef.current.focus()}
            style={{ cursor: 'text' }}>
            <div ref={logRef} style={{
              maxHeight: isMobile ? 72 : 110, overflowY: 'auto', fontSize: 12, lineHeight: 1.5,
              marginBottom: 4, paddingRight: 8,
            }}>
              {cmdLog.map((l, i) => (
                <div key={i} style={{
                  color: l.kind === 'err' ? '#ff5544' : l.kind === 'ok' ? accent : l.kind === 'sys' ? rgba(0.55) : '#fff',
                  textShadow: phosphor && l.kind !== 'err' ? `0 0 3px currentColor` : 'none',
                }}>{l.text}</div>
              ))}
              {typing && (
                <div style={{ color: '#fff' }}>$ {typing}<span style={{
                  display: 'inline-block', width: 7, height: 12, background: accent,
                  marginLeft: 2, animation: 'blink 1s steps(2) infinite', verticalAlign: 'middle',
                }} /></div>
              )}
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13 }}>
              <span style={{ color: accent, fontWeight: 700,
                textShadow: phosphor ? `0 0 4px ${accent}` : 'none' }}>mowgli@barely.cool:~$</span>
              <input
                ref={inputRef}
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={(e) => { if (e.key === 'Enter') runCmd(input); }}
                placeholder='type "help"'
                style={{
                  flex: 1, background: 'transparent', border: 'none', outline: 'none',
                  color: '#fff', fontFamily: 'inherit', fontSize: 13, caretColor: accent,
                }}
              />
            </div>
          </div>

          <div style={{
            borderLeft: isMobile ? 'none' : `1px solid ${rgba(0.22)}`,
            borderTop: isMobile ? `1px solid ${rgba(0.22)}` : 'none',
            paddingLeft: isMobile ? 0 : 16, paddingTop: isMobile ? 8 : 0,
            fontSize: 11 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between',
              color: rgba(0.55), marginBottom: 4, letterSpacing: 1 }}>
              <span>// cart.json</span>
              <span>{cart.length} item{cart.length === 1 ? '' : 's'}</span>
            </div>
            <div style={{ maxHeight: 80, overflowY: 'auto', marginBottom: 6 }}>
              {cart.length === 0 ? (
                <div style={{ color: rgba(0.45), fontSize: 11 }}>{'{ "items": [] }'}</div>
              ) : cart.map((it, i) => (
                <div key={i} style={{ display: 'flex', justifyContent: 'space-between',
                  alignItems: 'center', gap: 6, fontSize: 12, padding: '1px 0' }}>
                  <button
                    onClick={() => runCmd('rm ' + (i + 1))}
                    title="remove"
                    aria-label={'remove ' + it.sku}
                    style={{
                      background: 'transparent', border: 'none', cursor: 'pointer',
                      color: '#ff5544', fontFamily: 'inherit', fontSize: 13, lineHeight: 1,
                      padding: '0 2px', flexShrink: 0,
                    }}>×</button>
                  <span style={{ color: '#fff', flex: 1 }}>{it.sku}</span>
                  <span style={{ color: accent }}>${it.price}</span>
                </div>
              ))}
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between',
              borderTop: `1px dashed ${rgba(0.22)}`, paddingTop: 4,
              fontSize: 13, fontWeight: 700,
              textShadow: phosphor ? `0 0 4px ${accent}` : 'none' }}>
              <span>SUBTOTAL</span>
              <span>${total}.00</span>
            </div>
            <button
              onClick={() => cart.length && runCmd('checkout')}
              disabled={cart.length === 0}
              style={{
                width: '100%', marginTop: 6, padding: '6px',
                background: cart.length ? accent : 'transparent',
                color: cart.length ? '#000' : rgba(0.4),
                border: `1px solid ${cart.length ? accent : rgba(0.3)}`,
                fontFamily: 'inherit', fontWeight: 900, fontSize: 12,
                cursor: cart.length ? 'pointer' : 'not-allowed',
                letterSpacing: 2,
              }}>$ checkout --pay</button>
          </div>
        </div>
        <style>{`@keyframes blink{50%{opacity:0}}`}</style>
      </div>
    );
  }

  function Fc2Counter({ id }) {
    const ref = React.useRef(null);
    React.useEffect(() => {
      if (!ref.current) return;
      const s = document.createElement('script');
      s.src = `//counter1.fc2.com/counter.php?id=${id}&main=1`;
      ref.current.appendChild(s);
    }, [id]);
    return <span ref={ref} />;
  }

  function Root() {
    // Intro plays every visit — nothing is remembered.
    const [unlocked, setUnlocked] = React.useState(false);
    if (!unlocked) return <Gate onUnlock={() => setUnlocked(true)} />;
    return <Page />;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>

</body>
</html>
